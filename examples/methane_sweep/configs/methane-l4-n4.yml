name: methane-l4-n4
program: training/methane_configurations.py
method: grid
metric:
  name: T-MAE
  goal: minimize
parameters:
  wandb_mode:
    value: offline
  seed:
    values: [42, 1776, 7, 0]
  hiphop_l_max:
    values: [4]
  hiphop_n_max:
    values: [3, 4]
  n_epochs:
    value: 10000
  data_size:
    values: [1000000, 100000]
  test_set_size:
    value: 80000
  batch_size:
    value: 256
  eval_batch_size:
    value: 4096
  max_batch_size:
    value: 4096
  activation_max_batches:
    value: 10
  activation_max_values:
    value: 200000
  invariant_max_batches:
    value: 10
  invariant_max_values:
    value: 1000000
